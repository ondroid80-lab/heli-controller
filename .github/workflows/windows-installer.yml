name: Build Windows installer

on:
  push:
    branches: [main]
    paths: ["pc/**", ".github/workflows/windows-installer.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: pc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Závislosti a test mapování
        timeout-minutes: 8
        run: |
          python -m pip install --progress-bar off --timeout 60 --retries 3 -r requirements.txt
          python test_receiver.py

      - name: Sestavit HeliController.exe
        run: |
          pyinstaller --noconfirm --onedir --noconsole --name HeliController --add-data "config.json;." tray_app.py
          Copy-Item config.json dist\HeliController\config.json

      - name: Stáhnout instalátor vJoy (winget, pevná verze)
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          winget download --id ShaulEizikovich.vJoyDeviceDriver --version 2.1.9.1 --download-directory vendor --accept-package-agreements --accept-source-agreements
          $exe = Get-ChildItem vendor -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "vJoy installer nebyl stažen." }
          Move-Item -Force $exe.FullName vendor\vJoySetup.exe
          Get-FileHash vendor\vJoySetup.exe -Algorithm SHA256 | Format-List

      - name: Nainstalovat Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Sestavit instalátor
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          Get-ChildItem output

      - name: Zveřejnit instalátor v Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-installer
          name: Heli Controller – instalátor pro Windows (nejnovější)
          make_latest: false
          files: pc/output/HeliController-Setup.exe
          body: |
            Nejnovější instalátor z větve main (commit ${{ github.sha }}).
            Přímý odkaz: https://github.com/${{ github.repository }}/releases/download/latest-installer/HeliController-Setup.exe
