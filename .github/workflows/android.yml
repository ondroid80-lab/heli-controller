name: Build APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Sestavit debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Zveřejnit jako nejnovější Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Heli Controller (nejnovější APK)
          make_latest: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Nejnovější sestavení z větve main (commit ${{ github.sha }}).
            Stáhnout přímo v telefonu: https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk
